version: 2

# This is an input template: GoReleaser does not template goos/goarch itself.
# `make package` and CI materialize it with scripts/native-release-config.py,
# which also rejects cross-compilation. CI combines all native archives.
before:
  hooks:
    - go mod download
    - python3 scripts/release-licenses.py

builds:
  - main: ./cmd/metron
    binary: metron
    env: [CGO_ENABLED=1]
    goos: ["{{ .Env.GOOS }}"]
    goarch: ["{{ .Env.GOARCH }}"]
    ldflags:
      - -s -w -X main.version={{.Version}} {{ .Env.METRON_LINK_FLAGS }}

archives:
  # Stable names are required by install.sh.
  - name_template: "metron_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - src: bin/release-licenses/*
        dst: licenses
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
