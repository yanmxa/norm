name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CGO_ENABLED: "1"

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2022]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: install native Windows C compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: select Windows C compiler
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:/msys64/mingw64/bin' >> "$GITHUB_PATH"
      - name: native build and tests (no Node parser runtime)
        shell: bash
        run: |
          gcc --version
          go build ./...
          go test ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

      # The skill is written once in agent/metron.md and generated for each
      # assistant. A checked-in copy that has drifted is worse than none.
      - run: make skill-check

      - name: installer is valid POSIX sh
        run: sh -n install.sh

      # A dead link is the first thing a new reader hits, and the README had
      # one after a directory rename.
      - name: markdown links resolve
        run: ./.github/workflows/links.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      # Built with the toolchain that is already here rather than downloaded as
      # a release binary. golangci-lint refuses a module targeting a newer Go
      # than the linter itself was compiled with, and no published build tracks
      # a just-released Go closely enough to rely on.
      - name: install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - run: golangci-lint run --timeout 5m

  dogfood:
    # metron measures itself. A tool that reports on code quality has no
    # standing if its own code would not pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: build
        run: go build -o /tmp/metron ./cmd/metron

      - name: measure this change
        if: github.event_name == 'pull_request'
        run: |
          /tmp/metron --since origin/${{ github.base_ref }} --axes complexity,mutation \
            --budget 10m --fail-on headline

      - name: measure the whole repository
        if: github.event_name == 'push'
        run: /tmp/metron --all --axes complexity --fail-on headline
